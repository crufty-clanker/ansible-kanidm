---
# tasks file for kanidm_community.kanidm.kanidm_unixd - service management

- name: "Ensure kanidm_unixd service is enabled and started"
  ansible.builtin.systemd:
    name: "kanidm_unixd"
    state: "{{ kanidm_unixd_service_state }}"
    enabled: "{{ kanidm_unixd_service_enabled }}"
    daemon_reload: true
