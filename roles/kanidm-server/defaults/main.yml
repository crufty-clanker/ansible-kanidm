---
# defaults file for kanidm_community.kanidm.kanidm-server

# Version of Kanidm to install (from PPA)
kanidm_server_version: "1.1.0-1"

# Kanidm service user
kanidm_service_user: "kanidm"
kanidm_service_group: "kanidm"

# Listen address configuration
kanidm_listen_address: "0.0.0.0:8443"

# Domain name for the Kanidm server
kanidm_domain: "idm.example.com"

# Kanidm data directory
kanidm_data_dir: "/var/lib/kanidm"

# Kanidm log level (trace, debug, info, warn, error)
kanidm_log_level: "info"

# Admin email for domain configuration
kanidm_admin_email: "admin@example.com"

# TLS Certificate Configuration
kanidm_certbot_enabled: false
kanidm_certbot_email: "admin@example.com"
kanidm_certificate_dir: "/etc/kanidm/certs"

# Certificate files (used when certbot is disabled)
kanidm_tls_cert_file: ""
kanidm_tls_key_file: ""

# Kanidm HTTP port (for certbot HTTP-01 challenge)
kanidm_http_port: 80

# Database path
kanidm_database_path: "{{ kanidm_data_dir }}/kanidm.db"

# Kanidm service name
kanidm_service_name: "kanidm"

# Kanidm service state
kanidm_service_state: "started"

# Kanidm service enabled on boot
kanidm_service_enabled: true
