---
# handlers file for kanidm_community.kanidm.kanidm-server

- name: "Update apt cache"
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: "Restart kanidm service"
  ansible.builtin.systemd:
    name: "{{ kanidm_service_name }}"
    state: restarted
    enabled: true
