---
# defaults file for kanidm_community.kanidm.kanidm-client

# Version of Kanidm client to install (from PPA)
kanidm_client_version: "1.1.0-1"

# Distribution codename (auto-detected if empty)
kanidm_client_distro_codename: ""

# PPA repository URL
kanidm_client_ppa_url: "https://kanidm.github.io/kanidm_ppa"

# PPA component (stable or nightly)
kanidm_client_ppa_component: "stable"

# APT packages to install
kanidm_client_packages:
  - kanidm-tools

# APT key settings
kanidm_client_ppa_gpg_key_file: "kanidm_ppa.asc"
kanidm_client_ppa_gpg_key_dest: "/etc/apt/trusted.gpg.d/kanidm_ppa.asc"
