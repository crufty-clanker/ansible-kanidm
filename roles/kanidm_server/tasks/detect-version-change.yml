---
# tasks file for kanidm_community.kanidm.kanidm_server - detect if version has changed
# Runs before install so the upgrade check can proceed even if binary download fails

- name: "Set default facts"
  ansible.builtin.set_fact:
    _kanidm_version_changed: false
    _kanidm_is_fresh_install: false

- name: "Get currently running Kanidm version"
  ansible.builtin.command:
    cmd: kanidmd --version
  register: _kanidm_running_version
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ kanidm_service_user }}"

- name: "Detect fresh install (no existing binary)"
  ansible.builtin.set_fact:
    _kanidm_is_fresh_install: true
  when: _kanidm_running_version.rc | default(127) != 0

- name: "Strip leading 'v' from running version"
  ansible.builtin.set_fact:
    _kanidm_running_version_clean: "{{ _kanidm_running_version.stdout | replace('v', '') | split('-') | first | split('.') }}"
  when:
    - _kanidm_running_version.stdout | length > 0
    - _kanidm_running_version.stdout | startswith('v')

- name: "Use raw running version if no leading v"
  ansible.builtin.set_fact:
    _kanidm_running_version_clean: "{{ _kanidm_running_version.stdout | split('-') | first | split('.') }}"
  when:
    - _kanidm_running_version.stdout | length > 0
    - not (_kanidm_running_version.stdout | startswith('v'))

- name: "Parse running version components"
  ansible.builtin.set_fact:
    _kanidm_running_major: "{{ (_kanidm_running_version_clean | first) | int }}"
    _kanidm_running_minor: "{{ (_kanidm_running_version_clean | skipfirst | first) | int }}"
  when:
    - _kanidm_running_version.stdout | length > 0
    - _kanidm_running_version_clean | length >= 2

- name: "Detect version change (skipped on fresh install)"
  ansible.builtin.set_fact:
    _kanidm_version_changed: true
  when: >-
    not (_kanidm_is_fresh_install | bool) and
    (kanidm_version | regex_replace('^v?', '')) !=
    (_kanidm_running_version.stdout | regex_replace('^v?', ''))

- name: "Check for sequential upgrade requirement"
  ansible.builtin.fail:
    msg: >-
      Kanidm requires sequential upgrades through each minor version.
      Current version: {{ _kanidm_running_version.stdout | default('unknown') }}
      Target version: {{ kanidm_version }}
      You must upgrade through intermediate versions first.
      Example: from 1.3.x, upgrade to 1.4.x, then 1.5.x.
      Update kanidm_version to the next minor version and re-run.
  when: >-
    _kanidm_version_changed | bool and
    _kanidm_running_major | int == (kanidm_version | regex_replace('^v?', '')).split('.')[0] | int and
    ((kanidm_version | regex_replace('^v?', '')).split('.')[1] | int) - (_kanidm_running_minor | int) > 1

- name: "Report version status"
  ansible.builtin.debug:
    msg: >-
      Kanidm {{ 'fresh install' if (_kanidm_is_fresh_install | bool) else 'upgrade' }}.
      Version: {{ kanidm_version }}.
      Existing binary: {{ 'no' if (_kanidm_is_fresh_install | bool) else 'yes' }}.
