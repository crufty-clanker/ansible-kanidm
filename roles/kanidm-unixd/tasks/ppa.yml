---
# tasks file for kanidm_community.kanidm.kanidm-unixd - PPA setup

- name: "Install gnupg and apt-transport-https"
  ansible.builtin.apt:
    name:
      - gnupg
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: "Create trusted.gpg.d directory"
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Copy Kanidm PPA GPG key"
  ansible.builtin.copy:
    src: "{{ kanidm_unixd_ppa_gpg_key_file }}"
    dest: "{{ kanidm_unixd_ppa_gpg_key_dest }}"
    owner: root
    group: root
    mode: "0644"

- name: "Detect distribution codename"
  ansible.builtin.command:
    cmd: . /etc/os-release && echo ${VERSION_CODENAME}
  register: _kanidm_unixd_distro_codename
  changed_when: false
  failed_when: false
  when: kanidm_unixd_distro_codename | length == 0

- name: "Set distribution codename fact"
  ansible.builtin.set_fact:
    _kanidm_unixd_distro_codename: "{{ kanidm_unixd_distro_codename }}"
  when: kanidm_unixd_distro_codename | length > 0

- name: "Set codename from detection"
  ansible.builtin.set_fact:
    _kanidm_unixd_distro_codename: "{{ _kanidm_unixd_distro_codename.stdout }}"
  when: kanidm_unixd_distro_codename | length == 0 and _kanidm_unixd_distro_codename.stdout | length > 0

- name: "Fail if codename detection failed"
  ansible.builtin.fail:
    msg: "Could not detect distribution codename. Set kanidm_unixd_distro_codename manually."
  when: _kanidm_unixd_distro_codename | length == 0 or _kanidm_unixd_distro_codename == ""

- name: "Add Kanidm PPA sources list"
  ansible.builtin.copy:
    content: |
      deb [arch=amd64,arm64 signed-by=/etc/apt/trusted.gpg.d/kanidm_ppa.asc] {{ kanidm_unixd_ppa_url }} {{ _kanidm_unixd_distro_codename }} {{ kanidm_unixd_ppa_component }}
    dest: /etc/apt/sources.list.d/kanidm_ppa.list
    owner: root
    group: root
    mode: "0644"
  notify: "Update apt cache"

- name: "Update apt cache"
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
