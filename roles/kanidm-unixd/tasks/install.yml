---
# tasks file for kanidm_community.kanidm.kanidm-unixd - install via APT

- name: "Install kanidm-unixd packages"
  ansible.builtin.apt:
    name: "{{ kanidm_unixd_packages }}"
    state: present
    update_cache: true

- name: "Verify kanidm-unixd version"
  ansible.builtin.command:
    cmd: kanidm-unixd --version
  register: _kanidm_unixd_version
  changed_when: false
  failed_when: false

- name: "Report installed kanidm-unixd version"
  ansible.builtin.debug:
    msg: "kanidm-unixd version: {{ _kanidm_unixd_version.stdout | default('unknown') }}"
