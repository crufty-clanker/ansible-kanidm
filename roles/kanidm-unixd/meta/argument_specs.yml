---
argument_specs:
  main:
    short_description: Install and configure kanidm-unixd for PAM/SSSD integration
    description:
      - Installs kanidm-unixd from the official PPA
      - Configures NSS and PAM integration
      - Sets up systemd service
    version_added: "0.1.0"
    options:
      kanidm_unixd_version:
        description: Version of kanidm-unixd to install from PPA
        type: str
        default: "1.1.0-1"
      kanidm_unixd_distro_codename:
        description: Distribution codename (auto-detected if empty)
        type: str
        default: ""
      kanidm_unixd_ppa_url:
        description: PPA repository URL
        type: str
        default: "https://kanidm.github.io/kanidm_ppa"
      kanidm_unixd_ppa_component:
        description: PPA component (stable or nightly)
        type: str
        choices:
          - stable
          - nightly
        default: "stable"
      kanidm_unixd_packages:
        description: APT packages to install
        type: list
        elements: str
        default:
          - kanidm-unixd
          - libnss-kanidm
          - libpam-kanidm
      kanidm_unixd_domain:
        description: Kanidm domain name
        type: str
        default: "idm.example.com"
      kanidm_unixd_server:
        description: Kanidm server URL
        type: str
        default: "https://idm.example.com"
      kanidm_unixd_realmd_domain:
        description: Realm domain name
        type: str
        default: "idm.example.com"
      kanidm_unixd_cache_timeout:
        description: Cache timeout in seconds
        type: int
        default: 3600
      kanidm_unixd_nss_enable:
        description: Enable NSS integration
        type: bool
        default: true
      kanidm_unixd_nss_groups:
        description: Enable NSS groups
        type: bool
        default: true
      kanidm_unixd_nss_extra_groups:
        description: Enable NSS extra groups
        type: bool
        default: true
      kanidm_unixd_pam_enable:
        description: Enable PAM integration
        type: bool
        default: true
      kanidm_unixd_pam_ssh:
        description: Enable PAM SSH support
        type: bool
        default: true
      kanidm_unixd_service_state:
        description: Desired state of the service
        type: str
        choices:
          - started
          - stopped
          - restarted
        default: "started"
      kanidm_unixd_service_enabled:
        description: Enable service on boot
        type: bool
        default: true
