---
# tasks file for kanidm_community.kanidm.kanidm - pre-upgrade migration check
# Runs 'kanidmd domain upgrade-check' per official documentation:
# https://kanidm.github.io/kanidm/stable/server_updates.html

- name: "Run Kanidm domain upgrade check"
  ansible.builtin.command:
    cmd: >-
      {{ kanidm_install_dir }}/{{ _kanidm_binary_name }} domain upgrade-check
      --url https://{{ kanidm_domain }}
  register: _kanidm_upgrade_check
  changed_when: false
  become: true
  become_user: "{{ kanidm_service_user }}"
  environment:
    KANIDM_OPTS: "--origin https://{{ kanidm_domain }}"

- name: "Parse upgrade check results"
  ansible.builtin.set_fact:
    _kanidm_upgrade_issues: >-
      {{ _kanidm_upgrade_check.stdout_lines
         | select('search', '^upgrade_item')
         | list }}

- name: "Check for FAIL status in upgrade check"
  ansible.builtin.assert:
    that: "'FAIL' not in _kanidm_upgrade_check.stdout"
    fail_msg: >-
      Kanidm pre-upgrade check detected issues that must be resolved before upgrading.
      See output above for details on affected entries and required actions.
      After resolving, re-run this role.
    success_msg: "Kanidm domain upgrade check passed."

- name: "Report upgrade check result"
  ansible.builtin.debug:
    msg: "Kanidm upgrade check passed. Ready to proceed with upgrade."
  when: "'FAIL' not in _kanidm_upgrade_check.stdout"
