---
# tasks file for kanidm_community.kanidm.kanidm - installation

- name: "Calculate Kanidm architecture suffix"
  ansible.builtin.set_fact:
    _kanidm_arch: "{{ _kanidm_arch_map[kanidm_arch] | default('amd64') }}"

- name: "Construct Kanidm download URL"
  ansible.builtin.set_fact:
    _kanidm_download_url: "{{ _kanidm_base_url }}/{{ kanidm_version }}/kanidmd-{{ kanidm_version }}-{{ _kanidm_arch }}"

- name: "Create install directory"
  ansible.builtin.file:
    path: "{{ kanidm_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Download Kanidm binary"
  ansible.builtin.get_url:
    url: "{{ _kanidm_download_url }}"
    dest: "{{ kanidm_install_dir }}/{{ _kanidm_binary_name }}"
    mode: "0755"
    owner: root
    group: root
  register: _kanidm_binary_download

- name: "Verify new Kanidm binary version"
  ansible.builtin.command:
    cmd: "{{ kanidm_install_dir }}/{{ _kanidm_binary_name }} --version"
  register: _kanidm_new_version
  changed_when: false
  become: true
  become_user: root
  failed_when: _kanidm_new_version.stdout | regex_search(kanidm_version) | not

- name: "Get currently running Kanidm version"
  ansible.builtin.command:
    cmd: kanidmd --version
  register: _kanidm_running_version
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ kanidm_service_user }}"

- name: "Set default version change flag"
  ansible.builtin.set_fact:
    _kanidm_version_changed: false

- name: "Detect version change"
  ansible.builtin.set_fact:
    _kanidm_version_changed: true
  when: >-
    _kanidm_binary_download.changed | bool and
    (_kanidm_running_version.stdout | regex_search(kanidm_version) | default(false) | bool) | not

- name: "Report version status"
  ansible.builtin.debug:
    msg: >-
      Kanidm version {{ kanidm_version }} (new) vs
      {{ _kanidm_running_version.stdout | default('unknown') }} (running).
      Version changed: {{ _kanidm_version_changed | string }}.
